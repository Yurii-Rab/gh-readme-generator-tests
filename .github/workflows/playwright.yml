name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        run: npx playwright test

      # the report is only published when tests fail, that's the only time anyone needs it

      - name: Upload report
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

      - name: Publish report
        id: deployment
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        # a publishing problem shouldn't turn the check red, only failing tests should
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Add report link to the run summary
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        run: echo "### [Open the Playwright report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pull request comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- playwright-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));

            // tests passed: remove any old failure comment, the green check says enough
            if (process.env.TEST_RESULT === 'success') {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            // tests failed: post or update the comment, linking straight to the failed tests
            if (process.env.TEST_RESULT !== 'failure' || !process.env.REPORT_URL) return;

            const body = [
              marker,
              '## ❌ Playwright tests failed',
              '',
              `### [Open the report and traces](${process.env.REPORT_URL}#?q=s:failed)`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
